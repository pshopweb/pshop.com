<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Categories — PShop Admin</title>
<meta name="description" content="PShop admin panel">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="../assets/img/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin/admin.css">
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<a class="skip-link" href="#admin-main">Skip to main content</a>

<!-- Access gate: non-admins ko yahi rok diya jata hai -->
<div class="admin-gate" id="admin-gate" hidden>
  <div class="box">
    <div class="ico" id="gate-ico"></div>
    <h1 style="font-size:1.3rem">Admin access required</h1>
    <p class="muted small mt-2" id="gate-msg">
      This area is restricted to PShop administrators.</p>
    <a class="btn btn-primary btn-block mt-6" id="gate-login" href="../pages/login.html?admin=1">
      Sign in as admin</a>
    <a class="btn btn-ghost btn-block mt-2" href="../index.html">Back to store</a>
    <p class="xs muted mt-4">Demo admin — <b>admin@pshop.in</b> / <b>admin123</b></p>
  </div>
</div>

<div class="admin-shell" id="admin-shell" hidden>
  <aside class="admin-side" id="admin-side">
    <div class="admin-brand">
      <img src="../assets/img/icons/logo.svg" alt="PShop" width="220" height="56">
      <span class="tag">Admin</span>
    </div>
    <nav class="admin-nav" id="admin-nav" aria-label="Admin navigation"></nav>
    <div class="admin-foot">
      <button class="btn btn-sm btn-ghost btn-block" data-theme-toggle
              aria-label="Toggle theme"></button>
      <a class="btn btn-sm btn-ghost btn-block mt-1" href="../index.html">View store</a>
      <button class="btn btn-sm btn-ghost btn-block mt-1" id="admin-logout">Sign out</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <button class="btn-icon btn-ghost admin-burger" id="admin-burger"
              aria-label="Open menu"></button>
      <h1>Manage Categories</h1>
      <div class="right">
        <span class="badge badge-muted" id="backend-badge"></span>
        <span class="small semi" id="admin-name"></span>
      </div>
    </header>
    <main class="admin-body" id="admin-main">
      <div class="admin-toolbar">
        <p class="muted small" id="c-count"></p>
        <button class="btn btn-primary" id="btn-add-cat" style="margin-left:auto">Add category</button>
      </div>

      <section class="admin-panel">
        <div class="panel-body flush"><div class="table-wrap">
          <table class="data-table"><thead><tr>
            <th>Category</th><th>Slug</th><th>Sub categories</th>
            <th>Products</th><th>Status</th><th>Actions</th>
          </tr></thead><tbody id="c-rows"></tbody></table>
        </div></div>
      </section>

      <div class="modal" id="c-modal" role="dialog" aria-modal="true" aria-labelledby="c-modal-title">
        <div class="overlay"></div>
        <div class="modal-box" style="position:relative;z-index:1">
          <div class="modal-head"><h3 id="c-modal-title">Add category</h3>
            <button class="btn-icon btn-ghost" id="c-close" aria-label="Close">&times;</button></div>
          <form id="c-form" novalidate>
            <div class="modal-body">
              <div class="field"><label for="cf-name">Category name <span class="req">*</span></label>
                <input class="input" id="cf-name" required><p class="err-msg">Name is required.</p></div>
              <div class="field"><label for="cf-desc">Short description</label>
                <input class="input" id="cf-desc"></div>
              <div class="field"><label for="cf-subs">Sub categories (comma separated)</label>
                <textarea class="textarea" id="cf-subs" rows="2"
                  placeholder="Smartphones, Laptops, Headphones"></textarea></div>
              <div class="info-grid">
                <div class="field"><label for="cf-color">Theme colour</label>
                  <input class="input" id="cf-color" type="color" value="#2563eb" style="height:46px"></div>
                <div class="field"><label for="cf-order">Sort order</label>
                  <input class="input" id="cf-order" type="number" value="1" min="1"></div>
              </div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" type="button" id="c-cancel">Cancel</button>
              <button class="btn btn-primary" type="submit">Save category</button>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>
</div>
<div class="overlay" id="admin-overlay"></div>

<script type="module" src="../assets/js/admin/categories.js"></script>
</body>
</html>
