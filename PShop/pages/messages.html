<head>

<meta name="robots" content="noindex,nofollow">

<link rel="icon" href="../assets/img/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/icons/favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<!-- Fonts (async, non-blocking) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"></noscript>
<!-- Styles -->
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages/account.css">
<!-- Apply saved theme before first paint to avoid a flash -->
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="page-loader" role="status" aria-label="Loading PShop"><div class="ring"></div></div>

<div id="site-header"></div>

<main id="main" class="">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a><span class="sep">/</span>
      <a href="profile.html">My Account</a><span class="sep">/</span>
      <span aria-current="page">Messages</span>
    </nav>
    <div class="shell-account">
      <aside><nav class="account-nav" id="account-nav" aria-label="Account sections"></nav></aside>
      <section>
        <div class="page-head"><h1>Messages</h1></div>
        <div class="msg-shell">
          <div class="thread-pane">
            <button class="btn btn-primary btn-block mb-3" id="new-thread">Start a conversation</button>
            <div class="thread-list" id="thread-list"></div>
          </div>
          <div class="chat-pane" id="chat-pane">
            <div class="chat-head" id="chat-head"></div>
            <div class="chat-body" id="chat-body" aria-live="polite"></div>
            <form class="chat-foot" id="chat-form">
              <label class="sr-only" for="chat-input">Type your message</label>
              <input class="input" id="chat-input" placeholder="Type your message…" autocomplete="off">
              <button class="btn btn-primary btn-icon" type="submit" aria-label="Send message" id="send-btn"></button>
            </form>
          </div>
        </div>

      </section>
    </div>
  </div>

</main>

<div id="site-footer"></div>
<div id="bottom-nav"></div>

<noscript>
  <div style="padding:1rem;background:#fee2e2;color:#991b1b;text-align:center">
    PShop needs JavaScript enabled to load products and manage your cart.
  </div>
</noscript>

<script type="module" src="../assets/js/pages/messages.js"></script>
</body>
</html>
