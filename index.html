<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PShop — Online Shopping</title>
<meta http-equiv="refresh" content="0;url=PShop/index.html">
<link rel="icon" href="PShop/assets/img/icons/favicon.svg" type="image/svg+xml">
<style>
body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
min-height:100vh;margin:0;background:#f0f4ff;color:#1e293b;text-align:center}
.wrap{padding:2rem}
a{color:#2563eb;text-decoration:none;font-weight:600;font-size:1.1rem}
a:hover{text-decoration:underline}
p{margin:.5rem 0;color:#64748b;font-size:.9rem}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#2563eb;

@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>
// Instant redirect for browsers that ignore meta refresh
window.location.replace('PShop/index.html');
</script>
</head>
<body>
<div class="wrap">
  <div class="spinner"></div>

  <a href="PShop/index.html">Click here if not redirected</a>

</html>
