<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages/static.css">
<!-- Apply saved theme before first paint to avoid a flash -->
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>

<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="page-loader" role="status" aria-label="Loading PShop"><div class="ring"></div></div>

<div id="site-header"></div>

<main id="main" class="">

    <div class="err-page">
      <img src="../assets/img/misc/404.svg" alt="" width="600" height="320">
      <h1>This page went shopping without us</h1>
      <p>The page you are looking for does not exist, was moved, or the link has expired.

        <a class="btn btn-secondary btn-lg" href="shop.html">Browse products</a>
      </div>

      <div class="search-box" style="max-width:460px;width:100%;margin-top:2rem">
        <form id="err-search" role="search">
          <span class="s-ico" id="err-ico"></span>
          <label class="sr-only" for="err-q">Search products</label>
          <input type="search" id="err-q" placeholder="Search for a product instead…">
          <button class="s-btn" type="submit" aria-label="Search" id="err-btn"></button>
        </form>
      </div>

      <nav class="err-links" aria-label="Helpful links">
        <a href="../index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="category.html">Categories</a>
        <a href="orders.html">My Orders</a>
        <a href="track-order.html">Track Order</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </div>

</main>

<div id="site-footer"></div>
<div id="bottom-nav"></div>
