<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orders — PShop Admin</title>
<meta name="description" content="PShop admin panel">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f6fb">
<link rel="icon" href="../assets/img/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/admin/admin.css">
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',d?'#0b1120':'#f4f6fb');}catch(e){}})();
</script>
</head>
<body>
<a class="skip-link" href="#admin-main">Skip to main content</a>

<!-- Access gate: non-admins ko yahi rok diya jata hai -->
<div class="admin-gate" id="admin-gate" hidden>
  <div class="box">
    <div class="ico" id="gate-ico"></div>
    <h1 style="font-size:1.3rem">Admin access required</h1>
    <p class="muted small mt-2" id="gate-msg">
      This area is restricted to PShop administrators.</p>
    <a class="btn btn-primary btn-block mt-6" id="gate-login" href="../pages/login.html?admin=1">
      Sign in as admin</a>
    <a class="btn btn-ghost btn-block mt-2" href="../index.html">Back to store</a>
    <p class="xs muted mt-4">Demo admin — <b>admin@pshop.in</b> / <b>admin123</b></p>
  </div>
</div>

<div class="admin-shell" id="admin-shell" hidden>
  <aside class="admin-side" id="admin-side">
    <div class="admin-brand">
      <img src="../assets/img/icons/logo.svg" alt="PShop" width="220" height="56">
      <span class="tag">Admin</span>
    </div>
    <nav class="admin-nav" id="admin-nav" aria-label="Admin navigation"></nav>
    <div class="admin-foot">
      <button class="btn btn-sm btn-ghost btn-block" data-theme-toggle
              aria-label="Toggle theme"></button>
      <a class="btn btn-sm btn-ghost btn-block mt-1" href="../index.html">View store</a>
      <button class="btn btn-sm btn-ghost btn-block mt-1" id="admin-logout">Sign out</button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <button class="btn-icon btn-ghost admin-burger" id="admin-burger"
              aria-label="Open menu"></button>
      <h1>Manage Orders</h1>
      <div class="right">
        <span class="badge badge-muted" id="backend-badge"></span>
        <span class="small semi" id="admin-name"></span>
      </div>
    </header>
    <main class="admin-body" id="admin-main">
      <div class="kpi-grid" id="order-kpis"></div>

      <div class="admin-toolbar">
        <div class="input-group search">
          <span class="ig-icon" id="ico-search"></span>
          <label class="sr-only" for="o-search">Search orders</label>
          <input class="input" id="o-search" type="search" placeholder="Search by order ID, customer or AWB">
        </div>
        <label class="sr-only" for="o-status">Filter by status</label>
        <select class="select" id="o-status" style="max-width:200px">
          <option value="all">All statuses</option>
          <option>Placed</option><option>Confirmed</option><option>Packed</option>
          <option>Shipped</option><option>Out for Delivery</option><option>Delivered</option>
          <option>Cancelled</option>
        </select>
        <button class="btn btn-secondary" id="btn-export" style="margin-left:auto">Export CSV</button>
      </div>

      <section class="admin-panel">
        <header><h3 id="o-count">Orders</h3></header>
        <div class="panel-body flush"><div class="table-wrap">
          <table class="data-table"><thead><tr>
            <th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th>
            <th>Payment</th><th>Status</th><th>Date</th><th>Actions</th>
          </tr></thead><tbody id="o-rows"></tbody></table>
        </div></div>
        <div id="o-empty" hidden></div>
      </section>

      <!-- Order detail modal -->
      <div class="modal" id="o-modal" role="dialog" aria-modal="true" aria-labelledby="o-modal-title">
        <div class="overlay"></div>
        <div class="modal-box lg" style="position:relative;z-index:1">
          <div class="modal-head"><h3 id="o-modal-title">Order details</h3>
            <button class="btn-icon btn-ghost" id="o-close" aria-label="Close">&times;</button></div>
          <div class="modal-body" id="o-detail"></div>
          <div class="modal-foot">
            <button class="btn btn-secondary" id="o-invoice">Download invoice</button>
            <button class="btn btn-primary" id="o-modal-close">Done</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>
<div class="overlay" id="admin-overlay"></div>

<script type="module" src="../assets/js/admin/orders.js"></script>
</body>
</html>
