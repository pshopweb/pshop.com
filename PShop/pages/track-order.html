<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track Your Order — PShop</title>
<meta name="description" content="Track your PShop shipment in real time with live status updates.">
<meta name="keywords" content="track order, shipment tracking, where is my order">
<meta name="author" content="PShop Retail India Pvt. Ltd.">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://pshop.example/pages/track-order.html">
<!-- Open Graph / social -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="PShop">
<meta property="og:title" content="Track Your Order — PShop">
<meta property="og:description" content="Track your PShop shipment in real time with live status updates.">
<meta property="og:image" content="../assets/img/banners/banner-1.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Track Your Order — PShop">
<meta name="twitter:description" content="Track your PShop shipment in real time with live status updates.">
<meta name="robots" content="index,follow">
<!-- Icons & manifest -->
<link rel="icon" href="../assets/img/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/icons/favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<!-- Fonts (async, non-blocking) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"></noscript>
<!-- Styles -->
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages/checkout.css">
<!-- Apply saved theme before first paint to avoid a flash -->
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="page-loader" role="status" aria-label="Loading PShop"><div class="ring"></div></div>

<div id="site-header"></div>

<main id="main" class="">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a><span class="sep">/</span>
      <span aria-current="page">Track Order</span>
    </nav>

    <div class="page-head text-center">
      <h1>Track your order</h1>
      <p>Enter your order ID to see exactly where your package is.</p>
    </div>

    <form class="track-search" id="track-form" novalidate>
      <div class="flex gap-2" style="flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:220px;margin:0">
          <label class="sr-only" for="track-id">Order ID</label>
          <input class="input" id="track-id" placeholder="e.g. PS202612345678" required
                 autocomplete="off" spellcheck="false">
          <p class="err-msg">Please enter a valid order ID.</p>
        </div>
        <button class="btn btn-primary" type="submit" id="track-btn">Track</button>
      </div>
      <p class="xs muted text-center mt-3" id="track-hint"></p>
    </form>

    <div id="track-result" hidden>
      <div class="track-map">
        <div class="courier" id="courier-badge"></div>
      </div>

      <div class="shell-checkout">
        <div>
          <section class="co-panel">
            <header><h3>Shipment progress</h3><span id="track-status"></span></header>
            <div class="co-body"><div class="timeline" id="track-timeline"></div></div>
          </section>

          <section class="co-panel">
            <header><h3>Items in this shipment</h3></header>
            <div class="co-body"><div id="track-items"></div></div>
          </section>
        </div>

        <aside class="summary">
          <div class="summary-card">
            <h3>Delivery details</h3>
            <div class="summary-body" id="track-meta"></div>
          </div>
          <div class="info-card mt-4">
            <div class="flex gap-3 items-center">
              <span style="color:var(--brand-600)" id="help-ico"></span>
              <div><div class="semi small">Need help?</div>
                <div class="xs muted">Our team is available 24×7</div>
                <a class="small semi" href="contact.html"
                   style="color:var(--brand-600)">Contact support →</a></div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <div id="track-empty"></div>
  </div>

</main>

<div id="site-footer"></div>
<div id="bottom-nav"></div>

<noscript>
  <div style="padding:1rem;background:#fee2e2;color:#991b1b;text-align:center">
    PShop needs JavaScript enabled to load products and manage your cart.
  </div>
</noscript>

<script type="module" src="../assets/js/pages/track-order.js"></script>
</body>
</html>
