<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Orders — PShop</title>
<meta name="description" content="View, track, cancel or return your PShop orders.">
<meta name="keywords" content="my orders, order history, track order">
<meta name="author" content="PShop Retail India Pvt. Ltd.">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://pshop.example/pages/orders.html">
<!-- Open Graph / social -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="PShop">
<meta property="og:title" content="My Orders — PShop">
<meta property="og:description" content="View, track, cancel or return your PShop orders.">
<meta property="og:image" content="../assets/img/banners/banner-1.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="My Orders — PShop">
<meta name="twitter:description" content="View, track, cancel or return your PShop orders.">
<meta name="robots" content="noindex,nofollow">
<!-- Icons & manifest -->
<link rel="icon" href="../assets/img/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/icons/favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<!-- Fonts (async, non-blocking) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"></noscript>
<!-- Styles -->
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages/checkout.css">
<!-- Apply saved theme before first paint to avoid a flash -->
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="page-loader" role="status" aria-label="Loading PShop"><div class="ring"></div></div>

<div id="site-header"></div>

<main id="main" class="">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a><span class="sep">/</span>
      <a href="profile.html">My Account</a><span class="sep">/</span>
      <span aria-current="page">My Orders</span>
    </nav>

    <div class="shell-account">
      <aside><nav class="account-nav" id="account-nav" aria-label="Account sections"></nav></aside>
      <section>
        <div class="page-head">
          <h1>My Orders</h1>
          <p id="order-count">Loading your orders…</p>
        </div>

        <div class="flex justify-between items-center mb-4" style="flex-wrap:wrap;gap:.75rem">
          <div class="chip-scroll" id="status-filters">
            <button class="chip active" data-status="all">All orders</button>
            <button class="chip" data-status="Placed">Placed</button>
            <button class="chip" data-status="Shipped">Shipped</button>
            <button class="chip" data-status="Delivered">Delivered</button>
            <button class="chip" data-status="Cancelled">Cancelled</button>
          </div>
          <div class="input-group" style="max-width:260px">
            <span class="ig-icon" id="ico-search"></span>
            <label class="sr-only" for="order-search">Search orders</label>
            <input class="input" id="order-search" type="search" placeholder="Search by ID or product">
          </div>
        </div>

        <div id="orders-list"></div>
        <div id="orders-empty" hidden></div>
      </section>
    </div>
  </div>

</main>

<div id="site-footer"></div>
<div id="bottom-nav"></div>

<noscript>
  <div style="padding:1rem;background:#fee2e2;color:#991b1b;text-align:center">
    PShop needs JavaScript enabled to load products and manage your cart.
  </div>
</noscript>

<script type="module" src="../assets/js/pages/orders.js"></script>
</body>
</html>
