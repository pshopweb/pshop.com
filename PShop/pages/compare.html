<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compare Products — PShop</title>
<meta name="description" content="Compare specifications, prices and ratings of up to four PShop products side by side.">
<meta name="keywords" content="compare products, product comparison">
<meta name="author" content="PShop Retail India Pvt. Ltd.">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://pshop.example/pages/compare.html">
<!-- Open Graph / social -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="PShop">

<meta name="twitter:title" content="Compare Products — PShop">
<meta name="twitter:description" content="Compare specifications, prices and ratings of up to four PShop products side by side.">
<meta name="robots" content="noindex,nofollow">
<!-- Icons & manifest -->
<link rel="icon" href="../assets/img/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/icons/favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<!-- Fonts (async, non-blocking) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"></noscript>
<!-- Styles -->
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages/cart.css">
<!-- Apply saved theme before first paint to avoid a flash -->
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="page-loader" role="status" aria-label="Loading PShop"><div class="ring"></div></div>

<div id="site-header"></div>

<main id="main" class="">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a><span class="sep">/</span>
      <span aria-current="page">Compare</span>
    </nav>

    <div class="page-head">
      <h1>Compare Products</h1>
      <p id="cmp-count">Compare up to 4 products side by side.</p>
    </div>

    <div class="flex justify-between items-center mb-4" id="cmp-tools" hidden>
      <label class="check"><input type="checkbox" id="diff-only">
        <span>Highlight differences only</span></label>
      <button class="btn btn-sm btn-ghost" id="clear-cmp">Clear all</button>
    </div>

    <div class="compare-wrap" id="cmp-wrap" hidden>
      <table class="compare-table">
        <caption class="sr-only">Side-by-side product comparison</caption>
        <thead><tr id="cmp-head"></tr></thead>
        <tbody id="cmp-body"></tbody>
      </table>
    </div>

    <div id="cmp-empty" hidden></div>
  </div>

</main>

<div id="site-footer"></div>
<div id="bottom-nav"></div>

<noscript>
  <div style="padding:1rem;background:#fee2e2;color:#991b1b;text-align:center">
    PShop needs JavaScript enabled to load products and manage your cart.
  </div>
</noscript>

<script type="module" src="../assets/js/pages/compare.js"></script>
</body>
</html>
