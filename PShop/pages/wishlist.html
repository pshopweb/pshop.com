<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Wishlist — PShop</title>
<meta name="description" content="All the products you have saved on PShop, ready to move to your cart whenever you are.">
<meta name="keywords" content="wishlist, saved products, favourites">
<meta name="author" content="PShop Retail India Pvt. Ltd.">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://pshop.example/pages/wishlist.html">
<!-- Open Graph / social -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="PShop">
<meta property="og:title" content="My Wishlist — PShop">
<meta property="og:description" content="All the products you have saved on PShop, ready to move to your cart whenever you are.">
<meta property="og:image" content="../assets/img/banners/banner-1.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="My Wishlist — PShop">
<meta name="twitter:description" content="All the products you have saved on PShop, ready to move to your cart whenever you are.">
<meta name="robots" content="noindex,nofollow">
<!-- Icons & manifest -->
<link rel="icon" href="../assets/img/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/icons/favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<!-- Fonts (async, non-blocking) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"></noscript>
<!-- Styles -->
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages/cart.css">
<!-- Apply saved theme before first paint to avoid a flash -->
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="page-loader" role="status" aria-label="Loading PShop"><div class="ring"></div></div>

<div id="site-header"></div>

<main id="main" class="">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="../index.html">Home</a><span class="sep">/</span>
      <span aria-current="page">Wishlist</span>
    </nav>

    <div class="page-head">
      <h1>My Wishlist</h1>
      <p id="wish-count">Loading your saved items…</p>
    </div>

    <div class="wish-toolbar" id="wish-toolbar" hidden>
      <div class="chip-row">
        <button class="chip active" data-sort="recent">Recently added</button>
        <button class="chip" data-sort="price-asc">Price: Low to High</button>
        <button class="chip" data-sort="price-desc">Price: High to Low</button>
        <button class="chip" data-sort="discount">Biggest discount</button>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-sm btn-secondary" id="add-all">Add all to cart</button>
        <button class="btn btn-sm btn-ghost" id="clear-wish">Clear wishlist</button>
      </div>
    </div>

    <div class="product-grid" id="wish-grid"></div>
    <div id="wish-empty" hidden></div>

    <section class="section" id="wish-recs" hidden aria-labelledby="wr-title">
      <div class="section-title"><div><h2 id="wr-title">Recommended for you</h2></div></div>
      <div class="rail-wrap"><div class="rail" id="wish-rec-rail"></div></div>
    </section>
  </div>

</main>

<div id="site-footer"></div>
<div id="bottom-nav"></div>

<noscript>
  <div style="padding:1rem;background:#fee2e2;color:#991b1b;text-align:center">
    PShop needs JavaScript enabled to load products and manage your cart.
  </div>
</noscript>

<script type="module" src="../assets/js/pages/wishlist.js"></script>
</body>
</html>
