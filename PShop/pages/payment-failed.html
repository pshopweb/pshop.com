<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payment Failed — PShop</title>
<meta name="description" content="Your PShop payment did not go through. Retry with another method.">
<meta name="keywords" content="payment failed, retry payment">
<meta name="author" content="PShop Retail India Pvt. Ltd.">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://pshop.example/pages/payment-failed.html">
<!-- Open Graph / social -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="PShop">
<meta property="og:title" content="Payment Failed — PShop">
<meta property="og:description" content="Your PShop payment did not go through. Retry with another method.">
<meta property="og:image" content="../assets/img/banners/banner-1.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Payment Failed — PShop">
<meta name="twitter:description" content="Your PShop payment did not go through. Retry with another method.">
<meta name="robots" content="noindex,nofollow">
<!-- Icons & manifest -->
<link rel="icon" href="../assets/img/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/icons/favicon.svg">
<link rel="manifest" href="../manifest.webmanifest">
<!-- Fonts (async, non-blocking) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"></noscript>
<!-- Styles -->
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages/checkout.css">
<!-- Apply saved theme before first paint to avoid a flash -->
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('pshop_theme')||'"auto"');
var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="page-loader" role="status" aria-label="Loading PShop"><div class="ring"></div></div>

<div id="site-header"></div>

<main id="main" class="">
  <div class="container">
    <div class="result-hero">
      <div class="result-icon bad" id="bad-icon"></div>
      <h1>Payment could not be completed</h1>
      <p id="fail-reason">Your payment was not successful and you have not been charged.
         Any amount debited will be refunded automatically within 3–5 business days.</p>
      <div class="order-ref" id="attempt-ref"></div>
      <div class="result-actions">
        <button class="btn btn-primary" id="btn-retry">Retry payment</button>
        <a class="btn btn-secondary" href="cart.html">Back to cart</a>
        <a class="btn btn-ghost" href="contact.html">Contact support</a>
      </div>
    </div>

    <div class="container" style="max-width:720px">
      <section class="co-panel">
        <header><h3>Common reasons a payment fails</h3></header>
        <div class="co-body">
          <div class="pd-offers" id="fail-reasons"></div>
        </div>
      </section>

      <section class="co-panel">
        <header><h3>Your items are still saved</h3></header>
        <div class="co-body"><div id="fail-items"></div></div>
      </section>
    </div>
  </div>

</main>

<div id="site-footer"></div>
<div id="bottom-nav"></div>

<noscript>
  <div style="padding:1rem;background:#fee2e2;color:#991b1b;text-align:center">
    PShop needs JavaScript enabled to load products and manage your cart.
  </div>
</noscript>

<script type="module" src="../assets/js/pages/payment-failed.js"></script>
</body>
</html>
